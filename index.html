<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DSV bot · Asistente Virtual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#05070c;
    --bg-1:#0b1220;
    --panel:rgba(255,255,255,0.04);
    --panel-border:rgba(255,255,255,0.08);
    --cyan:#4fe3ff;
    --cyan-soft:#8ff3ff;
    --violet:#8b7bff;
    --text-0:#eaf3f8;
    --text-1:#9fb2c2;
    --danger:#ff6b7a;
    --font-display:'Space Grotesk', system-ui, sans-serif;
    --font-body:'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(79,227,255,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 90% 100%, rgba(139,123,255,0.08), transparent 60%),
      var(--bg-0);
    color:var(--text-0);
    font-family:var(--font-body);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .app{
    width:100%;
    max-width:460px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:8px;
    font-family:var(--font-display);
  }
  .brand .name{
    font-size:22px;
    font-weight:700;
    letter-spacing:0.5px;
  }
  .brand .tag{
    font-size:11px;
    color:var(--text-1);
    letter-spacing:1px;
    text-transform:uppercase;
  }
  .pill{
    font-size:11px;
    padding:5px 10px;
    border-radius:999px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    color:var(--text-1);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .pill .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--cyan);
    box-shadow:0 0 8px var(--cyan);
  }
  .pill.off .dot{background:var(--danger);box-shadow:0 0 8px var(--danger);}

  .stage-wrap{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 0 4px;
  }
  .stage{
    position:relative;
    width:290px;
    height:290px;
  }
  .ring{
    position:absolute;
    inset:-14px;
    border-radius:50%;
    border:1.5px solid rgba(79,227,255,0.25);
    opacity:0;
    transform:scale(0.9);
    transition:opacity .3s ease;
  }
  .ring.active{
    opacity:1;
    animation:pulse-ring 1.6s ease-out infinite;
  }
  @keyframes pulse-ring{
    0%{transform:scale(0.92);opacity:0.9;}
    70%{transform:scale(1.18);opacity:0;}
    100%{transform:scale(1.18);opacity:0;}
  }
  .face-panel{
    width:100%;height:100%;
    border-radius:38px;
    background:linear-gradient(160deg, #0e1626 0%, #070b13 100%);
    border:1px solid rgba(255,255,255,0.07);
    box-shadow:
      0 0 0 1px rgba(79,227,255,0.05) inset,
      0 20px 50px -20px rgba(0,0,0,0.7),
      0 0 60px -20px rgba(79,227,255,0.15);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  svg#face{width:80%;height:80%;}
  #eyeL, #eyeR{ transform-box:fill-box; transform-origin:center; transition:transform .09s ease; }
  .mouth{ stroke:var(--cyan); stroke-linecap:round; fill:none; }
  .whisker{ stroke:var(--cyan); stroke-width:1.6; stroke-linecap:round; opacity:0.5; fill:none; }

  .status-label{
    text-align:center;
    font-size:13px;
    color:var(--text-1);
    letter-spacing:0.3px;
    min-height:18px;
  }

  .chat{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:18px;
    padding:14px;
    height:260px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
    backdrop-filter:blur(10px);
  }
  .chat::-webkit-scrollbar{width:6px;}
  .chat::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:999px;}
  .bubble{
    max-width:82%;
    padding:9px 13px;
    border-radius:14px;
    font-size:14px;
    line-height:1.4;
    animation:rise .25s ease;
  }
  @keyframes rise{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .bubble.user{
    align-self:flex-end;
    background:linear-gradient(135deg, rgba(139,123,255,0.28), rgba(139,123,255,0.14));
    border:1px solid rgba(139,123,255,0.35);
    border-bottom-right-radius:4px;
  }
  .bubble.bot{
    align-self:flex-start;
    background:rgba(79,227,255,0.08);
    border:1px solid rgba(79,227,255,0.22);
    border-bottom-left-radius:4px;
  }
  .bubble.system{
    align-self:center;
    color:var(--text-1);
    font-size:12px;
    background:transparent;
    border:none;
    text-align:center;
  }

  .controls{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .text-form{
    flex:1;
    display:flex;
    gap:8px;
  }
  .text-form input{
    flex:1;
    background:var(--panel);
    border:1px solid var(--panel-border);
    color:var(--text-0);
    padding:12px 14px;
    border-radius:14px;
    font-family:var(--font-body);
    font-size:14px;
    outline:none;
  }
  .text-form input:focus{border-color:rgba(79,227,255,0.5);}
  .icon-btn{
    width:44px;height:44px;
    border-radius:14px;
    border:1px solid var(--panel-border);
    background:var(--panel);
    color:var(--text-0);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:background .15s ease, transform .1s ease, border-color .15s ease;
  }
  .icon-btn:hover{border-color:rgba(255,255,255,0.2);}
  .icon-btn:active{transform:scale(0.94);}
  .icon-btn svg{width:18px;height:18px;}

  .mic-btn{
    width:54px;height:54px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    background:linear-gradient(160deg, var(--cyan), var(--violet));
    color:#04121a;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    box-shadow:0 8px 24px -8px rgba(79,227,255,0.6);
    transition:transform .12s ease, box-shadow .15s ease;
  }
  .mic-btn svg{width:22px;height:22px;}
  .mic-btn:active{transform:scale(0.93);}
  .mic-btn.listening{
    background:linear-gradient(160deg, var(--danger), #ff9e6b);
    box-shadow:0 8px 24px -8px rgba(255,107,122,0.6);
  }
  .mic-btn:disabled{opacity:0.35;cursor:not-allowed;box-shadow:none;}

  .start-overlay{
    position:fixed;inset:0;
    background:var(--bg-0);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    z-index:10;
    text-align:center;
    padding:24px;
  }
  .start-overlay h1{
    font-family:var(--font-display);
    font-size:26px;
    margin:0;
  }
  .start-overlay p{
    color:var(--text-1);
    font-size:14px;
    max-width:320px;
    margin:0;
    line-height:1.5;
  }
  .start-btn{
    padding:14px 28px;
    border-radius:999px;
    border:none;
    background:linear-gradient(135deg, var(--cyan), var(--violet));
    color:#04121a;
    font-family:var(--font-display);
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    box-shadow:0 10px 30px -10px rgba(79,227,255,0.6);
  }
  .footnote{
    text-align:center;
    font-size:11px;
    color:var(--text-1);
    opacity:0.7;
  }
</style>
</head>

      </div>
    </div>
    <h1>Hola, soy DSV bot</h1>
    <p>Tu asistente virtual. Puedo escucharte y responderte por voz. Toca el botón para comenzar.</p>
    <button class="start-btn" id="startBtn">Comenzar</button>
  </div>

  <div class="app">
    <header>
      <div class="brand">
        <span class="name">DSV bot</span>
        <span class="tag">Asistente</span>
      </div>
      <div class="pill" id="voicePill"><span class="dot"></span><span id="voicePillText">Voz lista</span></div>
    </header>

    <div class="stage-wrap">
      <div class="stage">
        <div class="ring" id="ring"></div>
        <div class="face-panel">
          <svg id="face" viewBox="0 0 200 200">
            <defs>
              <linearGradient id="headGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#8ff3ff"/>
                <stop offset="55%" stop-color="#4fe3ff"/>
                <stop offset="100%" stop-color="#1c93b3"/>
              </linearGradient>
              <linearGradient id="earGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#4fe3ff"/>
                <stop offset="100%" stop-color="#1c93b3"/>
              </linearGradient>
              <linearGradient id="innerEarGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#d9ccff"/>
                <stop offset="100%" stop-color="#8b7bff"/>
              </linearGradient>
              <radialGradient id="irisGrad" cx="35%" cy="30%" r="75%">
                <stop offset="0%" stop-color="#eafeff"/>
                <stop offset="45%" stop-color="#8ff3ff"/>
                <stop offset="100%" stop-color="#1c93b3"/>
              </radialGradient>
              <linearGradient id="noseGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#d9ccff"/>
                <stop offset="100%" stop-color="#8b7bff"/>
              </linearGradient>
              <radialGradient id="muzzleShade" cx="50%" cy="0%" r="75%">
                <stop offset="0%" stop-color="#04121a" stop-opacity="0.22"/>
                <stop offset="100%" stop-color="#04121a" stop-opacity="0"/>
              </radialGradient>
              <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="3.2" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <g filter="url(#softGlow)">
              <!-- orejas (la base queda oculta detrás de la cabeza) -->

              <path fill="url(#earGrad)" d="M 158 68 C 165 45 170 25 166 10 C 155 22 140 35 128 55 C 136 62 148 66 158 68 Z"/>
              <path fill="url(#innerEarGrad)" d="M 50 60 C 46 45 44 32 47 20 C 54 28 63 38 69 50 C 63 54 56 58 50 60 Z"/>

              <!-- cabeza -->
              <path fill="url(#headGrad)" d="M 100 42 C 68 42 40 55 30 90 C 24 112 26 135 40 152 C 55 170 78 178 100 178 C 122 178 145 170 160 152 C 174 135 176 112 170 90 C 160 55 132 42 100 42 Z"/>

<script>
/* =========================================================================
   DSV bot — Asistente virtual 100% local (sin API keys, sin servicios de pago)
   -------------------------------------------------------------------------
   - Reconocimiento de voz: Web Speech API (SpeechRecognition), integrada
     en el navegador. Funciona bien en Chrome/Edge en Android/Windows/Mac.
     Firefox y Safari en iOS no la soportan todavía: en ese caso la app
     sigue funcionando con el cuadro de texto.
   - Síntesis de voz: Web Speech API (SpeechSynthesis), también nativa del
     navegador, sin claves.
   - "Cerebro": una base de conocimiento local (KB) más abajo, con
     coincidencia por palabras clave. No es una IA generativa real: solo
     reconoce patrones que tú definas. Para los niños esto es una ventaja:
     es 100% predecible y no necesita ni token ni tarjeta de nadie.
   - IMPORTANTE: para que el micrófono funcione, la página debe cargar por
     HTTPS (GitHub Pages ya sirve por HTTPS) o desde "localhost". Abrir el
     archivo index.html directamente con doble clic (file://) normalmente
     bloquea el micrófono por seguridad del navegador.
   ========================================================================= */

// ---------------------------------------------------------------------
// 1) CONFIGURACIÓN — edita esto para personalizar el asistente
// ---------------------------------------------------------------------
const CONFIG = {
  nombre: "DSV bot",
  idiomaVoz: "es-CO",       // idioma para escuchar y hablar
  velocidadVoz: 1.0,        // 0.5 (lento) a 1.5 (rápido)
  tonoVoz: 1.05,            // 0 (grave) a 2 (agudo)
  saludoInicial: "¡Hola! Soy DSV bot, tu asistente. Puedes preguntarme cosas o pedirme que te ayude. ¿En qué te ayudo hoy?"
};

// ---------------------------------------------------------------------
// 2) BASE DE CONOCIMIENTO — agrega tantas entradas como quieras.
//    "palabras" = términos que, si aparecen en la pregunta, activan esta
//    respuesta. "respuestas" = una o varias respuestas posibles (se elige
//    una al azar para que no suene repetitivo).
// ---------------------------------------------------------------------
const KB = [
  {
    palabras: ["hola", "buenas", "buenos dias", "buenas tardes", "buenas noches", "hey", "ola"],
    respuestas: ["¡Hola! ¿Cómo estás?", "¡Hola! Qué bueno hablar contigo.", "¡Hola! Dime, ¿en qué te ayudo?"]
  },
  {
    palabras: ["como estas", "como te encuentras", "que tal estas", "todo bien"],
    respuestas: ["¡Muy bien, gracias por preguntar! ¿Y tú cómo estás?", "Funcionando a la perfección, ¡listo para ayudarte!"]
  },

// Capitales para el patrón "capital de <país>"

  "colombia": "Bogotá",
  "mexico": "Ciudad de México",
  "argentina": "Buenos Aires",
  "chile": "Santiago",
  "peru": "Lima",
  "venezuela": "Caracas",
  "ecuador": "Quito",
  "bolivia": "Sucre",

  "estados unidos": "Washington D.C.",

};

const RESPUESTAS_SIN_COINCIDENCIA = [
  "No estoy segura de entender eso todavía. ¿Puedes decirlo de otra forma?",
  "Aún no tengo una respuesta para eso, pero puedes enseñarme agregándola a mi base de conocimiento.",

// ---------------------------------------------------------------------
// 3) UTILIDADES DE TEXTO
// ---------------------------------------------------------------------
function normalizar(texto) {
  return texto
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // quita tildes
    .replace(/[¿?¡!]/g, "")   // quita signos de interrogación/exclamación
    .replace(/[.,]+$/g, "")   // quita solo el punto/coma AL FINAL de la frase
    .trim();                  // (así no se pierden los puntos/comas decimales)
}

function elegirAlAzar(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

// Convierte un texto numérico (con posibles separadores de miles y un
// separador decimal en "." o ",") a un número real de JavaScript.
// Ej: "1.234.567,89" -> 1234567.89   |  "3,5" -> 3.5   |  "1200" -> 1200
function limpiarNumero(token) {
  const tieneComa = token.includes(",");
  const tienePunto = token.includes(".");

  if (tieneComa) {
    // la coma es el separador decimal (convención en Colombia/España);
    // cualquier punto presente se interpreta como separador de miles
    return parseFloat(token.replace(/\./g, "").replace(",", "."));
  }
  if (tienePunto) {
    const cantidadPuntos = (token.match(/\./g) || []).length;
    if (cantidadPuntos > 1) {
      // varios puntos: todos son separadores de miles (ej. 1.250.000)
      return parseFloat(token.replace(/\./g, ""));
    }
    // un solo punto: se interpreta como separador decimal (ej. 3.5)
    return parseFloat(token);
  }
  return parseFloat(token);
}

// ---------------------------------------------------------------------
// 4) INTENCIONES ESPECIALES (hora, fecha, capitales, matemáticas)
// ---------------------------------------------------------------------
function handleSpecialIntents(textoNormalizado) {
  // Hora
  if (textoNormalizado.includes("que hora es") || textoNormalizado.includes("dime la hora")) {
    const ahora = new Date();
    const hh = ahora.getHours().toString().padStart(2, "0");
    const mm = ahora.getMinutes().toString().padStart(2, "0");
    return `Son las ${hh}:${mm}.`;
  }

  // Fecha
  if (textoNormalizado.includes("que dia es hoy") || textoNormalizado.includes("que fecha es hoy") || textoNormalizado.includes("en que fecha estamos")) {
    const ahora = new Date();
    const opciones = { weekday: "long", year: "numeric", month: "long", day: "numeric" };
    return `Hoy es ${ahora.toLocaleDateString("es-ES", opciones)}.`;
  }

  // Capital de <país>
  if (textoNormalizado.includes("capital de")) {
    const pais = textoNormalizado.split("capital de")[1]?.trim();
    if (pais) {
      const paisLimpio = pais.replace(/^(el|la|los|las)\s/, "").trim();
      if (CAPITALES[paisLimpio]) {
        return `La capital de ${paisLimpio} es ${CAPITALES[paisLimpio]}.`;
      }
      return `No tengo guardada la capital de "${paisLimpio}", pero puedes agregarla en el objeto CAPITALES del código.`;
    }
  }

  // Matemáticas: funciona con frase ("cuanto es 5 mas 3", "calcula 10 por 2")
  // y también si se escribe la operación directamente ("34+56", "10 x 2")
  let expresion = textoNormalizado
    .replace(/mas/g, "+")
    .replace(/menos/g, "-")
    .replace(/dividido|entre/g, "/")
    .replace(/por/g, "*")
    .replace(/[x×]/g, "*")
    .replace(/÷/g, "/");

  // acepta enteros o decimales de CUALQUIER tamaño, con "." o "," como
  // separador. Si un número trae varios separadores (ej 1.234.567,89),
  // el último se interpreta como decimal y los anteriores como miles.
  const patronNumero = "-?\\d+(?:[.,]\\d+)*";
  const regexOperacion = new RegExp(`(${patronNumero})\\s*([\\+\\-\\*\\/])\\s*(${patronNumero})`);
  const regexExpresionCompleta = new RegExp(`^${patronNumero}\\s*[\\+\\-\\*\\/]\\s*${patronNumero}$`);

  const esConsultaExplicita = /cuanto (es|son|da)|calcula/.test(textoNormalizado);
  const esOperacionDirecta = regexExpresionCompleta.test(expresion.trim());

  if (esConsultaExplicita || esOperacionDirecta) {
    const match = expresion.match(regexOperacion);
    if (match) {
      const a = limpiarNumero(match[1]);
      const op = match[2];
      const b = limpiarNumero(match[3]);

      if (Number.isNaN(a) || Number.isNaN(b)) {
        return "No logré leer bien esos números. ¿Puedes repetirlos?";
      }

      let resultado;
      if (op === "+") resultado = a + b;
      else if (op === "-") resultado = a - b;
      else if (op === "*") resultado = a * b;
      else if (op === "/") resultado = b !== 0 ? a / b : null;

      if (resultado === null) return "No puedo dividir entre cero.";
      // redondea a máximo 6 decimales para evitar errores de coma flotante
      resultado = Math.round(resultado * 1e6) / 1e6;
      return `El resultado es ${resultado}.`;
    }
    if (esConsultaExplicita) {
      return "Dime la operación con dos números, por ejemplo: '¿cuánto es 8 más 4?'";
    }
  }

  return null;
}

// ---------------------------------------------------------------------
// 5) MOTOR DE COINCIDENCIA POR PALABRAS CLAVE
// ---------------------------------------------------------------------
function buscarRespuesta(textoUsuario) {
  const texto = normalizar(textoUsuario);

  const especial = handleSpecialIntents(texto);
  if (especial) return especial;

  let mejorEntrada = null;
  let mejorPuntaje = 0;

  for (const entrada of KB) {
    for (const frase of entrada.palabras) {
      if (texto.includes(frase)) {
        const puntaje = frase.split(" ").length; // frases más largas y específicas pesan más
        if (puntaje > mejorPuntaje) {
          mejorPuntaje = puntaje;
          mejorEntrada = entrada;
        }
      }
    }
  }

  if (mejorEntrada && mejorEntrada.respuestas.length > 0) {
    return elegirAlAzar(mejorEntrada.respuestas);
  }

  return elegirAlAzar(RESPUESTAS_SIN_COINCIDENCIA);
}

const chatEl = document.getElementById("chat");
const statusLabel = document.getElementById("statusLabel");
const micBtn = document.getElementById("micBtn");
const stopBtn = document.getElementById("stopBtn");
const textForm = document.getElementById("textForm");
const textInput = document.getElementById("textInput");
const ring = document.getElementById("ring");
const mouth = document.getElementById("mouth");
const eyeL = document.getElementById("eyeL");
const eyeR = document.getElementById("eyeR");
const voicePill = document.getElementById("voicePill");
const voicePillText = document.getElementById("voicePillText");
const startOverlay = document.getElementById("startOverlay");
const startBtn = document.getElementById("startBtn");

function agregarBurbuja(texto, tipo) {
  const div = document.createElement("div");
  div.className = "bubble " + tipo;
  div.textContent = texto;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function setStatus(texto) {
  statusLabel.textContent = texto;
}

// --- Parpadeo aleatorio de los ojos (idle) ---
function parpadear() {
  eyeL.style.transform = "scaleY(0.15)";
  eyeR.style.transform = "scaleY(0.15)";
  setTimeout(() => {
    eyeL.style.transform = "scaleY(1)";
    eyeR.style.transform = "scaleY(1)";
  }, 120);
}
setInterval(() => {
  if (Math.random() > 0.4) parpadear();
}, 3200 + Math.random() * 2000);

// --- Animación de la boca mientras habla ---
let mouthInterval = null;
const FORMAS_BOCA = [
  "M 78 152 Q 89 167 100 152 Q 111 167 122 152",
  "M 79 150 Q 89 174 100 150 Q 111 174 121 150",
  "M 81 152 Q 89 159 100 152 Q 111 159 119 152",
  "M 77 150 Q 89 170 100 150 Q 111 170 123 150"
];
function iniciarAnimacionBoca() {
  let i = 0;
  mouthInterval = setInterval(() => {
    mouth.setAttribute("d", FORMAS_BOCA[i % FORMAS_BOCA.length]);
    i++;
  }, 140);
}
function detenerAnimacionBoca() {
  clearInterval(mouthInterval);
  mouth.setAttribute("d", "M 78 152 Q 89 162 100 152 Q 111 162 122 152");
}

// ---------------------------------------------------------------------
// 7) SÍNTESIS DE VOZ (habla)
// ---------------------------------------------------------------------
let vozEspanol = null;
function cargarVoces() {
  const voces = window.speechSynthesis.getVoices();
  vozEspanol = voces.find(v => v.lang && v.lang.toLowerCase().startsWith("es")) || voces[0] || null;
}
if ("speechSynthesis" in window) {
  cargarVoces();
  window.speechSynthesis.onvoiceschanged = cargarVoces;
}

function hablar(texto) {
  if (!("speechSynthesis" in window)) {
    setStatus("Este navegador no soporta voz de salida.");
    return;
  }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(texto);
  utter.lang = CONFIG.idiomaVoz;
  utter.rate = CONFIG.velocidadVoz;
  utter.pitch = CONFIG.tonoVoz;
  if (vozEspanol) utter.voice = vozEspanol;

  utter.onstart = () => {
    setStatus("Hablando...");
    iniciarAnimacionBoca();
  };
  utter.onend = () => {
    detenerAnimacionBoca();
    setStatus("Toca el micrófono para hablar");
  };
  utter.onerror = () => {
    detenerAnimacionBoca();
    setStatus("Hubo un problema al hablar.");
  };

  window.speechSynthesis.speak(utter);
}

stopBtn.addEventListener("click", () => {
  window.speechSynthesis.cancel();
  detenerAnimacionBoca();
  setStatus("Voz detenida.");
});

// ---------------------------------------------------------------------
// 8) RECONOCIMIENTO DE VOZ (escucha)
// ---------------------------------------------------------------------
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let escuchando = false;

if (SpeechRecognitionAPI) {
  recognition = new SpeechRecognitionAPI();
  recognition.lang = CONFIG.idiomaVoz;
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    escuchando = true;
    micBtn.classList.add("listening");
    ring.classList.add("active");
    setStatus("Escuchando...");
  };

  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    procesarPregunta(transcript);
  };

  recognition.onerror = (event) => {
    escuchando = false;
    micBtn.classList.remove("listening");
    ring.classList.remove("active");
    if (event.error === "not-allowed" || event.error === "service-not-allowed") {
      setStatus("Permiso de micrófono denegado.");
      agregarBurbuja("No tengo permiso para usar el micrófono. Actívalo en la configuración del navegador.", "system");
    } else if (event.error === "no-speech") {
      setStatus("No escuché nada. Intenta de nuevo.");
    } else {
      setStatus("Error al escuchar: " + event.error);
    }
  };

  recognition.onend = () => {
    escuchando = false;
    micBtn.classList.remove("listening");
    ring.classList.remove("active");
  };
} else {
  micBtn.disabled = true;
  voicePill.classList.add("off");
  voicePillText.textContent = "Voz no soportada";
  setStatus("Este navegador no soporta el micrófono. Usa el cuadro de texto.");
}

micBtn.addEventListener("click", () => {
  if (!recognition) return;
  if (escuchando) {
    recognition.stop();
    return;
  }
  window.speechSynthesis.cancel();
  detenerAnimacionBoca();
  try {
    recognition.start();
  } catch (e) {
    // evita error si ya estaba iniciado
  }
});

// ---------------------------------------------------------------------
// 9) FLUJO PRINCIPAL: pregunta -> respuesta
// ---------------------------------------------------------------------
function procesarPregunta(texto) {
  if (!texto || !texto.trim()) return;
  agregarBurbuja(texto, "user");
  setStatus("Pensando...");

  setTimeout(() => {
    const respuesta = buscarRespuesta(texto);
    agregarBurbuja(respuesta, "bot");
    hablar(respuesta);
  }, 350);
}

textForm.addEventListener("submit", (e) => {
  e.preventDefault();
  const valor = textInput.value;
  textInput.value = "";
  procesarPregunta(valor);
});

// ---------------------------------------------------------------------
// 10) INICIO
// ---------------------------------------------------------------------
startBtn.addEventListener("click", () => {
  startOverlay.style.display = "none";
  agregarBurbuja(CONFIG.saludoInicial, "bot");
  hablar(CONFIG.saludoInicial);
});
